<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navrasa Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Navrasa Hub">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@font-face{font-family:'Agatho';src:url('https://vidasha.com/cdn/shop/files/Agatho_Regular.woff2?v=1792749480') format('woff2'),url('https://vidasha.com/cdn/shop/files/Agatho_Regular.woff?v=1792749417') format('woff');font-display:swap}
:root{--bg:#F7F2EB;--card:#FFFDF9;--ink:#201D1D;--muted:#625A55;--line:#D7CDC0;--maroon:#5A1324;--gold:#7E5A27;--goldbg:#EFE3D0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Montserrat,system-ui,sans-serif;padding:calc(20px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
h1{font:400 38px/1.05 Agatho,Georgia,serif;color:var(--maroon);margin:0}
h2{font:600 12px/1 Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:6px 0 0}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
a.tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:inherit;min-height:120px;transition:border-color .15s,transform .15s}
a.tile:hover,a.tile:focus-visible{border-color:var(--maroon);transform:translateY(-1px);outline:none}
.tile b{font:400 22px/1.15 Agatho,Georgia,serif;color:var(--maroon)}
.tile .stat{margin-top:auto;font-weight:600;font-size:13px;color:var(--ink)}
.tile .tag{align-self:flex-start;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--goldbg);color:var(--gold)}
.tile.soon{opacity:.6}
.btn{font:600 14px Montserrat,sans-serif;background:var(--maroon);color:#fff;border:0;border-radius:8px;padding:9px 14px;text-decoration:none;cursor:pointer}
.btn.sec{background:transparent;color:var(--maroon);border:1px solid var(--maroon)}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Navrasa Hub</h1><span class="muted" id="who">Every Navrasa system in one place.</span></div><div id="acct"></div></header>
<div id="body"><p class="muted">Loading…</p></div>
</div>
<script>
var sb = supabase.createClient('https://lqiqijquuuvkzzbcplxj.supabase.co', 'sb_publishable_kBZYhLDXRQnGkfJZiSXA9g_AqtUTiRg');
// Each system: who sees it (all / admin), group, link. Add new systems here.
var SYSTEMS = [
  { g: 'My work', n: 'Navrasa Tasks', d: 'Tasks, checklists, scores, Monday board', u: './', who: 'all', live: 'tasks' },
  { g: 'My work', n: 'Google Chat', d: 'Task reminders from Navrasa Tasks Bot', u: 'https://chat.google.com/', who: 'all' },
  { g: 'My work', n: 'Google Calendar', d: 'Your tasks and checklist times', u: 'https://calendar.google.com/', who: 'all' },
  { g: 'People', n: 'HRMS', d: 'Attendance, salary, hiring', u: '', who: 'admin', tag: 'Link to add' },
  { g: 'Factory', n: 'WIP (production)', d: 'Work in progress by department and job card', u: '', who: 'admin', tag: 'Link to add' },
  { g: 'Sales', n: 'Client Orders', d: 'Catalogue and order page for B2B clients', u: 'https://order.thenavrasa.com/', who: 'admin' },
  { g: 'Sales', n: 'TeleCRM', d: 'Leads and client calls', u: 'https://app.telecrm.in/', who: 'admin' },
  { g: 'Sales', n: 'Vidasha Shopify', d: 'Online store admin', u: 'https://admin.shopify.com/', who: 'admin' },
  { g: 'Sales', n: 'Vidasha Instagram agent', d: 'Jotform AI DM agent', u: 'https://www.jotform.com/myworkspace/', who: 'admin' },
  { g: 'Factory', n: 'Gati ERP (SJE Plus)', d: 'Desktop software: connect Sophos VPN, then open SJE Plus', u: '', who: 'admin', tag: 'Opens on office PC' },
  { g: 'Factory', n: 'Checklists library', d: 'Every role’s daily to yearly checklist', u: 'https://claude.ai/artifact/Q4nZBB7HtLNRriSQ7s5QrS', who: 'admin' },
  { g: 'Data', n: 'Supabase', d: 'Databases behind Tasks, HRMS and Gati sync', u: 'https://supabase.com/dashboard/projects', who: 'owner' },
  { g: 'Data', n: 'Google Drive', d: 'Company files and Navrasa Tasks Files', u: 'https://drive.google.com/', who: 'all' }
];
function e(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function draw(me, day) {
  var level = !me ? 'none' : me.access === 'Admin' ? 'owner' : (me.access === 'EA' || me.access === 'HOD' || me.access === 'PC') ? 'admin' : 'all';
  var ok = function (s) { return s.who === 'all' || (s.who === 'admin' && (level === 'admin' || level === 'owner')) || (s.who === 'owner' && level === 'owner'); };
  var groups = [];
  SYSTEMS.filter(ok).forEach(function (s) { if (groups.indexOf(s.g) < 0) groups.push(s.g); });
  var h = '';
  groups.forEach(function (g) {
    h += '<section><h2>' + e(g) + '</h2><div class="grid" style="margin-top:10px">' + SYSTEMS.filter(function (s) { return s.g === g && ok(s); }).map(function (s) {
      var stat = '';
      if (s.live === 'tasks' && day) stat = (day.tasks ? day.tasks.length : 0) + ' open tasks · ' + (day.checks ? day.checks.length : 0) + ' checklist items today';
      return '<a class="tile' + (s.u ? '' : ' soon') + '" ' + (s.u ? 'href="' + e(s.u) + '"' + (s.u.charAt(0) === '.' ? '' : ' target="_blank" rel="noopener"') : 'href="#" onclick="return false"') + '><b>' + e(s.n) + '</b><span class="muted">' + e(s.d) + '</span>' +
        (s.tag ? '<span class="tag">' + e(s.tag) + '</span>' : '') + (stat ? '<span class="stat">' + e(stat) + '</span>' : '') + '</a>';
    }).join('') + '</div></section>';
  });
  document.getElementById('body').innerHTML = h;
}
sb.auth.getSession().then(function (r) {
  if (!r.data.session) {
    document.getElementById('acct').innerHTML = '<a class="btn" href="./">Sign in</a>';
    document.getElementById('who').textContent = 'Sign in once with Navrasa Tasks to see your systems.';
    draw(null, null); return;
  }
  return sb.rpc('api_boot').then(function (b) {
    var me = b.data && b.data.me;
    document.getElementById('who').textContent = me ? 'Namaste ' + me.name + '. Every Navrasa system in one place.' : '';
    document.getElementById('acct').innerHTML = '<button class="btn sec" id="so">Sign out</button>';
    document.getElementById('so').onclick = function () { sb.auth.signOut().then(function () { location.reload(); }); };
    return sb.rpc('api_my_day').then(function (d) { draw(me, d.data); }, function () { draw(me, null); });
  });
});
</script>
</body>
</html>
