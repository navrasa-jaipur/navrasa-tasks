<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5A1324">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Navrasa">
<title>Navrasa Tasks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F7F2EB;--card:#fff;--ink:#201D1D;--muted:#625A55;--line:#D7CDC0;--maroon:#5A1324;--gold:#7E5A27;--goldbg:#EFE3D0;--red:#A3262A;--redbg:#F7E1DF;--green:#2F6B3A;--greenbg:#E3F0E2;--chip:#ECE4D8}
@font-face{font-family:'Agatho';src:url('https://vidasha.com/cdn/shop/files/Agatho_Regular.woff2?v=1792749480') format('woff2'),url('https://vidasha.com/cdn/shop/files/Agatho_Regular.woff?v=1792749417') format('woff');font-weight:400;font-style:normal;font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Montserrat',system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.bar{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.brand{font:400 24px 'Agatho',Georgia,serif;color:var(--maroon);letter-spacing:.02em}
nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
nav button{font:inherit;font-size:15px;border:none;background:none;padding:9px 12px;border-radius:8px;color:var(--ink);cursor:pointer;min-height:42px}
nav button.on{background:#F1E1E4;color:var(--maroon);font-weight:700}
@media(max-width:900px){nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}nav button{white-space:nowrap}.who{margin-left:auto}}
.who{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.who button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
h1{font:400 30px/1.2 'Agatho',Georgia,serif;color:var(--maroon);margin:0}
h2{font:400 19px/1.3 'Agatho',Georgia,serif;margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:10px}
.task{cursor:pointer;text-align:left;font:inherit;color:inherit}
.task:hover{border-color:#C9B48F}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--chip);color:#5C4A3A}
.c-high{background:#F1E1E4;color:var(--maroon)}.c-red{background:var(--redbg);color:var(--red)}.c-green{background:var(--greenbg);color:var(--green)}.c-gold{background:var(--goldbg);color:var(--gold)}
.score{background:var(--maroon);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.score b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-weight:400;padding:10px;border:1px solid #CFC3B3;border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
.btn{font:inherit;font-weight:700;border:none;border-radius:10px;background:var(--maroon);color:#fff;min-height:44px;padding:0 18px;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #CFC3B3;font-weight:600}
.btn.ok{background:var(--green)}.btn.bad{background:var(--red)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #CFC3B3;border-radius:8px;overflow:hidden}
.seg button{font:inherit;min-height:42px;border:none;background:#fff;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid #CFC3B3}
.seg button.on{background:var(--maroon);color:#fff;font-weight:700}
.pill{font:inherit;font-size:14px;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid #CFC3B3;background:#fff;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #E8DFD3}
.check:first-child{border-top:none}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{background:var(--goldbg);text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#5C4A3A;padding:9px 12px}
td{padding:9px 12px;border-top:1px solid #E8DFD3;vertical-align:top}
.num{font-variant-numeric:tabular-nums}
.barw{height:10px;background:#F4EDE2;border-radius:99px;overflow:hidden;min-width:80px;flex:1}
.barw div{height:100%;border-radius:99px}
.sheet{position:fixed;inset:0;background:rgba(42,26,28,.45);display:flex;justify-content:center;align-items:flex-end;z-index:20}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.err{background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px}
.links a{display:block;word-break:break-all;font-size:14px;color:var(--maroon)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
pre.log{white-space:pre-wrap;font-size:12px;color:var(--muted);margin:0}
.login{max-width:420px;margin:8vh auto;padding:0 16px;display:flex;flex-direction:column;gap:16px}
.or{text-align:center;color:var(--muted);font-size:13px}
.media{display:flex;flex-wrap:wrap;gap:8px}
.media label.btn{display:inline-flex;flex-direction:row;align-items:center;font-size:14px;font-weight:600}
.att{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:14px;border-top:1px solid #E8DFD3;padding-top:8px}
.att img,.att video{max-width:160px;max-height:120px;border-radius:8px}
.att audio{max-width:240px}
.hello h1{font-size:34px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tile .tl,.next .tl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.tile b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile b small{font-size:14px;font-weight:600;color:var(--muted)}
.tile.dark{background:var(--maroon);border-color:var(--maroon);color:#fff}
.tile.dark .tl{color:#E9C9A0}.tile.dark span:not(.tl){font-size:13px}
.next{background:var(--goldbg);border:1px solid #DCC6A2;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.next b{font:400 22px/1.25 'Agatho',Georgia,serif;color:var(--maroon)}
.next.late{background:var(--redbg);border-color:#E7B9B5}.next.late .tl{color:var(--red)}
.next.done{background:var(--greenbg);border-color:#BCD8BB}.next.done .tl{color:var(--green)}
.btn.light{background:var(--maroon);color:#fff}
.timeline{position:relative;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:74px 18px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;position:relative}
.ev .when{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.ev .dot{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #BFAE97;justify-self:center;z-index:1}
.ev::before{content:'';position:absolute;left:91px;top:0;bottom:0;width:2px;background:#E8DFD3}
.ev .what{display:flex;flex-direction:column;gap:1px;min-width:0}
.ev .what span:first-child{font-weight:600}
.ev.ok .dot{background:var(--green);border-color:var(--green)}
.ev.ok .what span:first-child{color:var(--muted);text-decoration:line-through}
.ev.warn .dot{background:var(--gold);border-color:var(--gold)}.ev.warn .when{color:var(--red)}
.ev.bad .dot{background:var(--red);border-color:var(--red)}
.ev.task-ev .dot{border-radius:3px;border-color:var(--maroon)}
@media(max-width:560px){.ev .chip,.ev .btn{grid-column:3;justify-self:start}}
.now{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:12px;font-weight:700;color:var(--red)}
.now::before{content:'';width:82px}.now::after{content:'';flex:1;height:2px;background:var(--red);opacity:.5}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.tile .barw{flex:none;min-width:0}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,1fr);gap:8px}.tile{padding:10px;gap:4px}.tile b{font-size:26px}.tile b small{display:block;font-size:12px;margin-top:4px}.tile .tl{font-size:10px}.tile .muted,.tile.dark span:not(.tl){font-size:11px}.ev{grid-template-columns:62px 14px 1fr}.ev::before{left:74px}.now::before{width:70px}}
.where{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.where>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}

/* ---------- app shell: sidebar (iPad/desktop), bottom bar (phone) ---------- */
#shell{display:flex;min-height:100vh}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
#side{width:240px;flex:none;background:#2B0A12;color:#EADBD0;display:flex;flex-direction:column;gap:6px;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sbrand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:400 24px 'Agatho',Georgia,serif;padding:4px 8px 10px}
.logo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--maroon);color:#E9C9A0;font:400 20px 'Agatho',Georgia,serif;border:1px solid #7a3446}
.sbtn-new{font:inherit;font-weight:700;background:#E9C9A0;color:#2B0A12;border:none;border-radius:10px;min-height:42px;cursor:pointer;margin:0 4px 6px}
#snav{display:flex;flex-direction:column;gap:2px;flex:1}
#snav .sh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#B99A8C;padding:12px 10px 4px}
#snav button,#snav a{font:inherit;font-size:14.5px;text-align:left;border:none;background:none;color:#EADBD0;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;text-decoration:none}
#snav button:hover,#snav a:hover{background:#3d1520}
#snav button.on{background:#4a1a27;color:#fff;font-weight:700}
#snav .ic{width:18px;text-align:center;opacity:.85}
#snav .cnt{margin-left:auto;font-size:12px;background:#5A1324;border-radius:99px;padding:0 7px}
.sfoot{display:flex;align-items:center;gap:10px;border-top:1px solid #4a1a27;padding:12px 6px 2px;font-size:13px}
.sfoot b{display:block;color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot span{color:#B99A8C;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot .av{display:inline-grid;color:#fff;font-size:11.5px}
.mob{display:none}
@media(max-width:700px){.mob{display:inline}}
.sout{font:inherit;font-size:12px;background:none;border:1px solid #6b2a3a;color:#EADBD0;border-radius:7px;padding:5px 8px;cursor:pointer}
header .bar{max-width:none;display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:nowrap}
.ptitle{font:400 24px/1.15 'Agatho',Georgia,serif;color:var(--maroon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtabs{display:flex;gap:2px;margin-top:4px;overflow-x:auto}
.vtabs button{font:inherit;font-size:13.5px;border:none;background:none;padding:5px 10px;border-radius:7px;color:var(--muted);cursor:pointer;white-space:nowrap}
.vtabs button.on{color:var(--maroon);font-weight:700;background:#F1E1E4}
#q{width:220px;flex:none;padding:8px 12px;border-radius:99px}
.mbrand{display:none}
main{max-width:1180px;width:100%}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:11.5px;font-weight:700;color:#fff;flex:none}
.av.sm{width:22px;height:22px;font-size:10px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);display:none;padding:4px max(6px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#bnav button{flex:1;font:inherit;font-size:11px;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;min-height:50px}
#bnav button .ic{font-size:19px;line-height:1}
#bnav button.on{color:var(--maroon);font-weight:700}
@media(max-width:899px){
  #side{display:none!important}
  #bnav:not([hidden]){display:flex}
  .mbrand{display:block}
  header .bar{padding:8px 14px}
  #q{display:none}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  nav#nav{display:none}
}
/* side drawer for task details on wide screens (Any.do style) */
@media(min-width:900px){.sheet{justify-content:flex-end;align-items:stretch}.panel{border-radius:0;max-width:520px;max-height:none;height:100vh;box-shadow:-12px 0 30px rgba(43,10,18,.18)}}
/* scope pills */
.scope{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* list view (Asana / Any.do) */
.tl-group{display:flex;flex-direction:column}
.tl-gh{display:flex;align-items:center;gap:8px;font:400 19px 'Agatho',Georgia,serif;padding:12px 4px 6px;cursor:pointer;border:none;background:none;color:var(--ink);text-align:left}
.tl-gh .n{font:600 12px Montserrat,sans-serif;color:var(--muted);background:var(--chip);border-radius:99px;padding:1px 8px}
.tl-gh.red{color:var(--red)}
.tl-head,.tl-row{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 110px 90px;gap:10px;align-items:center}
.tl-head{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line)}
.tl-box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl-row{padding:10px 12px;border-top:1px solid #EFE7DC;cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;font:inherit;color:inherit;text-align:left;width:100%}
.tl-row:first-child{border-top:none}
.tl-row:hover{background:#FBF6EF}
.tl-row .ttl{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-row .sub{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row .who2{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.tl-row .who2 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row .due{font-size:13px;font-variant-numeric:tabular-nums}
.tl-row .due.late{color:var(--red);font-weight:700}
.circ{width:20px;height:20px;border-radius:50%;border:2px solid #BFAE97;display:inline-grid;place-items:center;font-size:12px;color:#fff}
.circ.done{background:var(--green);border-color:var(--green)}
.circ.qc{border-color:var(--gold);background:var(--goldbg);color:var(--gold)}
.circ.red{border-color:var(--red)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.p-High{background:var(--red)}.p-Medium{background:#D59B1F}.p-Low{background:var(--green)}
@media(max-width:700px){.tl-head{display:none}.tl-row{grid-template-columns:24px minmax(0,1fr) auto}.tl-row .who2,.tl-row .pr{display:none}}
.quick{display:flex;gap:8px;align-items:center;background:var(--card);border:1px dashed #CFC3B3;border-radius:12px;padding:6px 6px 6px 14px}
.quick input{border:none;padding:8px 0;background:transparent}
.quick input:focus{outline:none}
/* board view (Trello) */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;align-items:flex-start}
.kcol{flex:0 0 280px;scroll-snap-align:start;background:#EFE6DA;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 220px);overflow-y:auto}
.kcol h3{margin:0;font:700 14px Montserrat,sans-serif;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.kcol h3 .n{font-weight:600;color:var(--muted);font-size:12px}
.kcard{background:var(--card);border-radius:10px;padding:10px;box-shadow:0 1px 0 rgba(43,10,18,.12);display:flex;flex-direction:column;gap:8px;cursor:pointer;border:none;font:inherit;color:inherit;text-align:left;width:100%}
.kcard:hover{box-shadow:0 0 0 2px #C9B48F}
.kcard .lbl{height:6px;width:44px;border-radius:99px}
.kcard .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.kcard .badge{border-radius:5px;padding:1px 6px;font-weight:600;font-size:11.5px;background:var(--chip);color:#5C4A3A}
.kcard .badge.late{background:var(--redbg);color:var(--red)}
.kcard .badge.today{background:var(--goldbg);color:var(--gold)}
.kcol.c-late{background:#F4DEDB}.kcol.c-qc{background:#EFE3CF}.kcol.c-done{background:#E1EDDF}
@media(max-width:700px){.kcol{flex-basis:84vw;max-height:none}}
/* calendar view */
.calh{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calg .dh{background:var(--goldbg);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#5C4A3A;padding:6px 8px}
.calg .dc{background:var(--card);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.calg .dc.out{background:#F8F3EC;color:#B3A79B}
.calg .dc .dn{font-size:12.5px;font-weight:600}
.calg .dc.td .dn{background:var(--maroon);color:#fff;border-radius:99px;width:24px;height:24px;display:grid;place-items:center}
.calg .ev2{font-size:11.5px;border-radius:4px;padding:2px 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:none;font-family:inherit;text-align:left;cursor:pointer}
.ev2.High{background:#C0392B}.ev2.Medium{background:#C98A12}.ev2.Low{background:#3E8A4F}.ev2.done{opacity:.45;text-decoration:line-through}
.calg .more{font-size:11px;color:var(--muted)}
.agenda{display:none}
@media(max-width:700px){.calg{display:none}.agenda{display:flex;flex-direction:column;gap:12px}}
.btn.rec{background:var(--red);color:#fff;border-color:var(--red)}
</style>
</head>
<body>
<div id="shell" class="noshell">
<aside id="side" hidden>
  <a class="sbrand" href="hub.html" title="Open Navrasa Hub"><span class="logo">N</span><span>Navrasa</span></a>
  <button class="sbtn-new" id="sNew" hidden onclick="go('new')">+ New task</button>
  <nav id="snav"></nav>
  <div class="sfoot"><span class="av" id="sAv"></span><div style="min-width:0;flex:1"><b id="sName"></b><span id="sRole"></span></div><button class="sout" onclick="signOut()" title="Sign out">Sign out</button></div>
</aside>
<div id="col">
  <header id="hdr" hidden><div class="bar">
    <span class="mbrand"><span class="logo">N</span></span>

// ---------- speech to text (Cloudflare Whisper via our server): Hindi, Hinglish or English in, English text out ----------
function recordClip(btn, maxSec, idle) {
  return new Promise(function (ok, bad) {
    if (!navigator.mediaDevices || !window.MediaRecorder) return bad('This phone cannot record here.');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var type = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
      var mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined), chunks = [], t0 = Date.now(), tm;
      REC = mr;
      mr.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mr.onstop = function () { stream.getTracks().forEach(function (t) { t.stop(); }); clearInterval(tm); REC = null; btn.textContent = idle; btn.classList.remove('rec'); ok(new Blob(chunks, { type: mr.mimeType || type || 'audio/webm' })); };
      mr.start(); btn.classList.add('rec');
      tm = setInterval(function () { var sec = Math.round((Date.now() - t0) / 1000); btn.textContent = 'Stop · ' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); if (sec >= maxSec) mr.stop(); }, 300);
    }).catch(function () { bad('Allow the microphone first.'); });
  });
}

    if (/^video/.test(f.type) || /\.(mp4|mov|avi|mkv|webm|3gp)$/i.test(f.name) && !/^audio/.test(f.type)) { toast('Videos are not uploaded here. Share a Drive link instead.'); return null; }

// photos are resized to max 1600px and saved as JPEG (~200-400 KB) to keep storage small
function shrinkPhoto(f) {
  return new Promise(function (ok) {
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { ok(b && b.size < f.size ? new File([b], f.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : f); }, 'image/jpeg', 0.75);
    };
    img.onerror = function () { URL.revokeObjectURL(url); ok(f); };
    img.src = url;
  });
}

    var type = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
    var mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined), chunks = [], t0 = Date.now();
    REC = mr;

// Calendar: month grid (iPad/desktop) and day-by-day agenda (phone)
VIEWS.cal = function () { return loadTasks().then(drawCal); };
function drawCal() {
  var all = filtered().filter(function (t) { return t.current_due && t.status !== 'Withdrawn'; });
  var m = APP.calMonth || APP.today.slice(0, 7), y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1;
  var first = new Date(Date.UTC(y, mo, 1)), startDow = (first.getUTCDay() + 6) % 7; // Monday first

// ---------- My Day ----------
function nowHM() { var d = new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function hm12(t) { var h = +t.slice(0, 2), m = t.slice(3, 5); return ((h + 11) % 12 + 1) + (m === '00' ? '' : ':' + m) + (h < 12 ? ' AM' : ' PM'); }
VIEWS.day = function () {
  return call('api_my_day').then(function (d) {
    var open = d.tasks.filter(function (t) { return ['Sent', 'Accepted', 'Rework', 'QC pending'].indexOf(t.status) > -1; });
    var due = open.filter(function (t) { return t.current_due <= APP.today || t.status === 'Sent' || t.status === 'Rework'; });
    var later = open.filter(function (t) { return due.indexOf(t) < 0; });
    var closed = d.tasks.filter(function (t) { return open.indexOf(t) < 0; });
    var now = nowHM(), cut = (APP.cutoff || '19:00');
    APP.checks = {}; d.checks.forEach(function (c) { APP.checks[c.id] = c; });
    var isDone = function (c) { return ['Done', 'Done late'].indexOf(c.status) > -1; };
    var doneN = d.checks.filter(isDone).length, totN = d.checks.length;
    var high = open.filter(function (t) { return t.priority === 'High'; }).length;
    // one list for today: checklist items at their time, tasks due today at the 7 PM cutoff
    var items = d.checks.map(function (c) { var t = String(c.due_time).slice(0, 5); return { kind: 'c', t: c.due_date < APP.today ? '00:00' : t, c: c, late: c.due_date < APP.today }; })
      .concat(due.filter(function (t) { return t.status !== 'QC pending'; }).map(function (t) { return { kind: 't', t: cut, k: t, late: t.current_due < APP.today }; }))
      .sort(function (x, y) { return x.t < y.t ? -1 : x.t > y.t ? 1 : 0; });
    var pending = items.filter(function (i) { return i.kind === 't' || !isDone(i.c) && ['Not done', 'False tick'].indexOf(i.c.status) < 0; });
    var next = pending[0];
    var h = '<div class="hello"><div><span class="muted">' + e(fmtDate(APP.today)) + (APP.working ? '' : ' · holiday or weekly off') + '</span><h1>Namaste ' + e(APP.me.name) + '</h1><span class="muted">' + e(APP.me.role || '') + (APP.me.department ? ' · ' + e(APP.me.department) : '') + '</span></div></div>';
    // three tiles
    var pctDone = totN ? Math.round(doneN * 100 / totN) : 0;
    h += '<div class="tiles">' +
      '<div class="tile"><span class="tl">Today’s checklist</span><b>' + doneN + '<small> of ' + totN + ' done</small></b><div class="barw"><div style="width:' + pctDone + '%;background:var(--green)"></div></div></div>' +
      '<div class="tile"><span class="tl">My open tasks</span><b>' + open.length + '<small>' + (high ? ' · ' + high + ' high' : '') + '</small></b><span class="muted">' + (due.length ? due.length + ' due today or late' : 'None due today') + '</span></div>' +
      '<div class="tile dark"><span class="tl">My score this week</span><b>' + (d.score === null ? '0%' : pct(d.score)) + '</b><span>' + (d.score === null ? 'Nothing missed yet. Keep it at 0.' : 'Minus = work not done on time. Bring it to 0.') + (d.last !== null ? ' Last week ' + pct(d.last) + '.' : '') + '</span></div>' +
      '</div>';
    // next up
    if (next) {
      var nl = next.kind === 'c' ? next.c.task : next.k.task, nt = next.late ? 'Late — from ' + fmtDate(next.kind === 'c' ? next.c.due_date : next.k.current_due) : (next.t <= now ? 'Overdue since ' + hm12(next.t) : 'Due by ' + hm12(next.t));
      h += '<section class="next' + (next.late || next.t <= now ? ' late' : '') + '"><span class="tl">Do this next</span><b>' + e(nl) + '</b><div class="row" style="justify-content:space-between"><span>' + e(nt) + '</span>' +
        (next.kind === 'c' ? '<button class="btn small light" onclick="openTick(' + next.c.id + ')">Tick with proof</button>' : '<button class="btn small light" onclick="openTask(' + next.k.id + ')">Open task</button>') + '</div></section>';
      if (next.kind === 't') APP.tasks[next.k.id] = next.k;

    // timeline

      var st, cls, act = '';

        var c = i.c, dn = isDone(c), miss = ['Not done', 'False tick'].indexOf(c.status) > -1;

        act = dn || miss ? '' : '<button class="btn sec small" onclick="openTick(' + c.id + ')">Tick</button>';
        tl += '<div class="ev ' + cls + '"><span class="when">' + (i.late ? 'Late' : hm12(i.t)) + '</span><span class="dot"></span><div class="what"><span>' + e(c.task) + '</span><span class="muted">Checklist · ' + e(c.frequency) + '</span></div>' + st + act + '</div>';
      } else {

    var qc = open.filter(function (t) { return t.status === 'QC pending'; });
    if (qc.length) h += '<section class="list"><h2>Waiting for quality check</h2>' + qc.map(function (t) { return taskCard(t); }).join('') + '</section>';
    if (later.filter(function (t) { return t.status !== 'QC pending'; }).length) h += '<section class="list"><h2>Coming up</h2>' + later.filter(function (t) { return t.status !== 'QC pending'; }).map(function (t) { return taskCard(t); }).join('') + '</section>';

      '<div><b>Google Calendar</b><span class="muted">' + (m.cal ? (m.calShared ? 'In the shared ' + e(m.cal) + ' calendar, marked with your name' : 'In your own calendar (' + e(m.cal) + ')') + '. Checklists show 30 minutes before their time; tasks show on the due day.' : 'You have no company email, so reminders are only here and on your printed sheet.') + '</span>' + (m.cal ? '<a class="btn sec small" target="_blank" rel="noopener" href="https://calendar.google.com/">Open Calendar</a>' : '') + '</div>' +
      '<div><b>Google Chat</b><span class="muted">' + (m.chat ? 'Navrasa Tasks Bot messages you at 9:30 AM, 1:30 PM and 5:30 PM with what is due.' : 'Not set up for you yet.') + '</span>' + (m.chat ? '<a class="btn sec small" target="_blank" rel="noopener" href="https://chat.google.com/">Open Chat</a>' : '') + '</div>' +
      '</div></section>';
    $('view').innerHTML = h;
  });
};

// ---------- speak a task: the phone's own speech recognition (free), then fill the form ----------
var SPK = null;
function speakTask() {
  var R = window.SpeechRecognition || window.webkitSpeechRecognition, b = $('spk');
  if (SPK) { SPK.stop(); return; }
  if (REC) { REC.stop(); return; }
  if (APP.stt) {
    $('spt').textContent = 'Listening… speak in Hindi or English, then tap Stop.';
    recordClip(b, 90, 'Speak').then(function (blob) { $('spt').textContent = 'Writing it down…'; b.textContent = 'Wait…'; return sttSend(blob, 'task'); })
      .then(function (t) { b.textContent = 'Speak'; if (t) fillFromSpeech(t); else $('spt').textContent = 'Could not hear anything. Try again.'; })
      .catch(function (m) { b.textContent = 'Speak'; $('spt').textContent = ''; toast(m); });
    return;
  }
  if (!R) { toast('This browser cannot listen. Use Chrome on Android or Safari on iPhone.'); return; }
  var r = new R(), text = ''; SPK = r;
  r.lang = 'en-IN'; r.interimResults = true; r.continuous = true;
  r.onresult = function (ev) { text = ''; for (var i = 0; i < ev.results.length; i++) text += ev.results[i][0].transcript + ' '; $('spt').textContent = text; };
  r.onerror = function (ev) { toast(ev.error === 'not-allowed' ? 'Allow the microphone to speak a task.' : 'Could not hear clearly. Try again.'); };
  r.onend = function () { SPK = null; b.textContent = 'Speak'; b.classList.remove('rec'); if (text.trim()) fillFromSpeech(text.trim()); };
  r.start(); b.textContent = 'Stop'; b.classList.add('rec'); $('spt').textContent = 'Listening…';
}
function fillFromSpeech(t) {
  var low = ' ' + t.toLowerCase().replace(/[.,!?]/g, ' ') + ' ', rest = t;
  // owner: longest name (or first name) heard
  var opts = [].slice.call($('no').options).map(function (o) { return o.value; }).filter(Boolean), best = null, bestWord = '';
  opts.forEach(function (n) {
    [n.toLowerCase(), n.toLowerCase().split(' ')[0]].forEach(function (w) {
      if (w.length > 2 && low.indexOf(' ' + w + ' ') > -1 && w.length > bestWord.length) { best = n; bestWord = w; }
    });
  });
  if (best) { $('no').value = best; loadOwner(); best.toLowerCase().split(' ').forEach(function (w) { if (w.length > 1) rest = rest.replace(new RegExp('\\b' + w.replace(/[^a-z]/g, '') + '\\b', 'i'), ''); }); }
  // priority
  var pr = /\b(high|urgent|important|zaroori|jaruri)\b/.test(low) ? 'High' : /\blow\b/.test(low) ? 'Low' : 'Medium';
  setPrio([].filter.call($('npr').children, function (x) { return x.textContent === pr; })[0], pr);
  rest = rest.replace(/\b(high|medium|low|urgent|important)\b( priority)?/ig, '');
  // date
  var base = new Date(APP.today + 'T00:00:00Z'), d = null, m;
  var days = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6, somvar: 1, mangalvar: 2, budhvar: 3, guruvar: 4, shukravar: 5, shanivar: 6 };
  var mons = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  if (/\b(day after tomorrow|parso|parson)\b/.test(low)) d = 2;
  else if (/\b(tomorrow|kal)\b/.test(low)) d = 1;
  else if ((m = low.match(/\b(?:in|within)?\s*(\d{1,2}|two|three|four|five|seven|ten)\s*(days|din)\b/))) d = ({ two: 2, three: 3, four: 4, five: 5, seven: 7, ten: 10 })[m[1]] || +m[1];
  else if (/\b(next week|agle hafte)\b/.test(low)) d = 7;
  if (d !== null) d = addDays(APP.today, d);
  if (!d) Object.keys(days).forEach(function (k) { if (!d && low.indexOf(' ' + k + ' ') > -1) { var diff = (days[k] - base.getUTCDay() + 7) % 7 || 7; d = addDays(APP.today, diff); } });
  if (!d && (m = low.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/))) {
    var y = base.getUTCFullYear(), dt = new Date(Date.UTC(y, mons[m[2]], +m[1]));
    if (dt <= base) dt = new Date(Date.UTC(y + 1, mons[m[2]], +m[1]));
    d = dt.toISOString().slice(0, 10);
  }
  if (d) $('ndt').value = d;
  rest = rest.replace(/\b(by|before|on|till|until)?\s*(day after tomorrow|tomorrow|today|next week|parso|kal|(this |next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)|\d{1,2}(st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*|in \d+ days)\b/ig, '');
  rest = rest.replace(/^[\s,]*(ji|sir)\b/i, '').replace(/\b(priority)\b/ig, '').replace(/\s{2,}/g, ' ').replace(/^[\s,:\-]+|[\s,:\-]+$/g, '');
  rest = rest.charAt(0).toUpperCase() + rest.slice(1);
  $('nt').value = rest;
  if (!$('nd').value) $('nd').value = rest + ' — completed, as spoken by ' + (APP.me.name || '') + '.';
  $('spt').innerHTML = 'Heard: “' + e(t) + '”' + (best ? '' : '<br><b style="color:var(--red)">Name not found. Choose the owner.</b>') + (d ? '' : '<br><b style="color:var(--red)">Date not found. Choose the date.</b>');
}

VIEWS.team = function () {
  return call('api_team').then(function (d) {
    var h = '<div><h1>My team</h1><span class="muted">If you pass a company task to your team, it stays in your name.</span></div>';
    h += '<section class="list"><h2>My company tasks · count in my score</h2>' + (d.mine.length ? d.mine.map(function (t) { return taskCard(t); }).join('') : '<p class="empty">None open.</p>') + '</section>';
    h += '<section class="list"><h2>Team tasks I gave · not in company score</h2>' + (d.given.length ? d.given.map(function (t) { return taskCard(t, 'To ' + t.owner); }).join('') : '<p class="empty">None open.</p>') + '</section>';
    h += '<section class="card"><h2>Team checklists today</h2>' + (d.team.length ? d.team.map(function (n) {
      var c = d.checks[n] || { done: 0, total: 0, open: [] }, w = c.total ? c.done / c.total * 100 : 0;
      return '<div class="check" style="flex-direction:column;gap:4px"><div class="row" style="justify-content:space-between;width:100%"><b>' + e(n) + '</b><span class="num">' + c.done + ' of ' + c.total + '</span></div><div class="barw" style="width:100%"><div style="width:' + w + '%;background:' + (w === 100 ? '#2F6B3A' : w >= 60 ? '#AF7F3E' : '#A3262A') + '"></div></div>' + (c.open.length ? '<span class="muted">Open: ' + e(c.open.join(', ')) + '</span>' : '') + '</div>';
    }).join('') : '<p class="empty">Nobody has you as HOD in the people list yet.</p>') + '</section>';
    $('view').innerHTML = h;
  });
};

// ---------- checklist set-up ----------
VIEWS.setup = function () {
  return call('api_checklists', { p_dept: APP.setupDept || null }).then(function (rows) {
    APP.cl = {}; rows.forEach(function (r) { APP.cl[r.id] = r; });
    var depts = {}; APP.users.forEach(function (u) { if (u.department) depts[u.department] = 1; }); rows.forEach(function (r) { if (r.department) depts[r.department] = 1; });
    var on = rows.filter(function (r) { return r.active; }).length;
    var h = '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Checklists</h1><span class="muted">' + on + ' of ' + rows.length + ' switched on. Give each item an owner and switch it on when the HOD agrees.</span></div>' +
      '<div class="row"><select id="sdep" style="width:auto" onchange="APP.setupDept=this.value||null;go(\'setup\')"><option value="">All departments</option>' + Object.keys(depts).sort().map(function (d) { return '<option' + (d === APP.setupDept ? ' selected' : '') + '>' + e(d) + '</option>'; }).join('') + '</select>' +
      '<button class="btn small" onclick="editCl()">Add item</button></div></div>';
    h += '<div class="tbl"><table><thead><tr><th>On</th><th>Item</th><th>Owner</th><th>How often</th><th>Due</th><th></th></tr></thead><tbody>' + rows.map(function (r) {
      return '<tr><td>' + (r.active ? '<span class="chip c-green">On</span>' : '<span class="chip">Off</span>') + '</td><td>' + e(r.task) + '<br><span class="muted">' + e(r.role || '') + ' · proof: ' + e(r.proof_type || '') + '</span></td><td>' + (r.owner ? e(r.owner) : '<span class="muted">No owner</span>') + '</td>' +
        '<td>' + e(r.frequency) + '</td><td class="num">' + e((r.due_day ? r.due_day + (r.months ? ' (months ' + r.months + ')' : '') + ', ' : '') + String(r.due_time).slice(0, 5)) + '</td><td><button class="btn sec small" onclick="editCl(' + r.id + ')">Edit</button></td></tr>';
    }).join('') + '</tbody></table></div>';
    $('view').innerHTML = h;
  });
};
function editCl(id) {
  var r = id ? APP.cl[id] : { frequency: 'Daily', due_time: '18:00:00', active: false, department: APP.setupDept || APP.me.department };
  var opt = function (list, v) { return list.map(function (x) { return '<option' + (x === v ? ' selected' : '') + '>' + e(x) + '</option>'; }).join(''); };
  sheet('<h2>' + (id ? 'Edit checklist item' : 'New checklist item') + '</h2><label>Item<textarea id="ct" rows="2">' + e(r.task || '') + '</textarea></label>' +
    '<div class="grid"><label>Owner<select id="co"><option value="">No owner yet</option>' + APP.users.map(function (u) { return '<option' + (u.name === r.owner ? ' selected' : '') + '>' + e(u.name) + '</option>'; }).join('') + '</select></label>' +
    '<label>Role<input id="cr" value="' + e(r.role || '') + '"></label></div>' +
    '<div class="grid"><label>How often<select id="cf">' + opt(['Daily', 'Weekly', 'Monthly', 'Quarterly', 'Yearly'], r.frequency) + '</select></label>' +
    '<label>Due day<input id="cd" value="' + e(r.due_day || '') + '" placeholder="Weekly: Mon…Sat. Monthly: 1–31 or Last"></label>' +
    '<label>Months (quarterly / yearly)<input id="cm" value="' + e(r.months || '') + '" placeholder="e.g. 1,4,7,10"></label>' +
    '<label>Due time<input id="cti" type="time" value="' + e(String(r.due_time || '18:00').slice(0, 5)) + '"></label></div>' +
    '<div class="grid"><label>Proof<input id="cp" value="' + e(r.proof_type || '') + '" placeholder="Photo, File, Screenshot…"></label>' +
    '<label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="cl"' + (r.legal ? ' checked' : '') + '> Legal deadline (move earlier on holidays)</label>' +
    '<label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="ca"' + (r.active ? ' checked' : '') + '> Switched on</label></div>' +
    '<div id="ce"></div><div class="row"><button class="btn" id="cs">Save</button><button class="btn sec" onclick="closeSheet()">Cancel</button></div>');
  $('cs').onclick = function () {
    var b = this; busy(b, true);
    call('api_checklist_save', { c: { id: id || '', task: $('ct').value.trim(), owner: $('co').value, role: $('cr').value.trim(), frequency: $('cf').value, due_day: $('cd').value.trim(),
      months: $('cm').value.trim(), due_time: $('cti').value, proof_type: $('cp').value.trim(), legal: $('cl').checked, active: $('ca').checked, department: r.department || '' } })
      .then(function () { closeSheet(); toast('Saved'); go('setup'); }).catch(function (m) { busy(b, false); errBox('ce', m); });
  };
}

// ---------- roles: who does which job (and gets its checklist) ----------
VIEWS.roles = function () {
  return call('api_roles').then(function (rows) {
    APP.roles = rows;
    var h = '<div><h1>Roles</h1><span class="muted">Who does each job. The person named here gets that role\'s checklist in the app and in Google Calendar. When someone leaves, replace the name and press Save. Several people: separate names with commas. Nobody: leave it empty.</span></div>';
    var dep = '';
    h += '<div class="tbl"><table><thead><tr><th>Department</th><th>Role</th><th>Person(s)</th><th>Items</th><th></th></tr></thead><tbody>' + rows.map(function (r, i) {
      var d = r.department === dep ? '' : r.department; dep = r.department;
      return '<tr><td>' + e(d) + '</td><td><b>' + e(r.role) + '</b></td><td><input id="ro' + i + '" value="' + e(r.people) + '" style="min-width:200px"></td><td>' + r.items + '</td>' +
        '<td><button class="btn sec small" onclick="saveRole(' + i + ',this)">Save</button></td></tr>';
    }).join('') + '</tbody></table></div>';
    $('view').innerHTML = h;
  });
};
function saveRole(i, b) {
  busy(b, true);
  call('api_assign_role', { p_role: APP.roles[i].role, p_names: $('ro' + i).value })
    .then(function () { busy(b, false); toast('Saved. Calendar updates within 15 minutes.'); })
    .catch(function (m) { busy(b, false); toast(String(m)); });
}

// ---------- people ----------
VIEWS.people = function () {
  return call('api_people').then(function (rows) {
    APP.pp = {}; rows.forEach(function (r) { APP.pp[r.id] = r; });
    var h = '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>People</h1><span class="muted">Office staff sign in with the Google email written here. Floor staff use a staff code and PIN.</span></div><button class="btn small" onclick="editPerson()">Add person</button></div>';
    h += '<div class="tbl"><table><thead><tr><th>Name</th><th>Role</th><th>Department</th><th>HOD</th><th>Access</th><th>Login</th><th></th></tr></thead><tbody>' + rows.map(function (r) {
      var login = r.staff_code ? 'Code ' + r.staff_code : (r.email || '<span style="color:var(--red)">Missing</span>');
      return '<tr style="' + (r.active ? '' : 'opacity:.5') + '"><td><b>' + e(r.name) + '</b></td><td>' + e(r.role || '') + '</td><td>' + e(r.department || '') + '</td><td>' + e(r.hod || '') + '</td><td>' + e(r.access) + '</td>' +
        '<td>' + (r.staff_code ? e(login) : (r.email ? e(r.email) : login)) + (r.linked ? ' <span class="chip c-green">signed in</span>' : '') + '</td><td><button class="btn sec small" onclick="editPerson(' + r.id + ')">Edit</button></td></tr>';
    }).join('') + '</tbody></table></div>';
    $('view').innerHTML = h;
  });
};
function editPerson(id) {
  var r = id ? APP.pp[id] : { access: 'Member', active: true };
  var names = Object.keys(APP.pp).map(function (k) { return APP.pp[k].name; }).sort();
  sheet('<h2>' + (id ? 'Edit ' + e(r.name) : 'Add person') + '</h2><div class="grid"><label>Name<input id="pn" value="' + e(r.name || '') + '"></label><label>Google email (office staff)<input id="pe2" value="' + e(r.email || '') + '" placeholder="name@thenavrasa.com"></label></div>' +
    '<div class="grid"><label>Role<input id="pr" value="' + e(r.role || '') + '"></label><label>Department<input id="pd2" value="' + e(r.department || '') + '"></label>' +
    '<label>HOD<select id="ph"><option value="">None</option>' + names.map(function (n) { return '<option' + (n === r.hod ? ' selected' : '') + '>' + e(n) + '</option>'; }).join('') + '</select></label>' +
    '<label>Access<select id="pa">' + ['Member', 'HOD', 'PC', 'EA', 'Admin'].map(function (x) { return '<option' + (x === r.access ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></label></div>' +
    '<label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="pac"' + (r.active ? ' checked' : '') + '> Active</label>' +
    '<div id="pe"></div><div class="row"><button class="btn" id="psv">Save</button><button class="btn sec" onclick="closeSheet()">Cancel</button></div>' +
    (id ? '<details class="card"><summary style="cursor:pointer;font-weight:600">Staff code and PIN (for staff without a Google account)</summary><div class="grid"><label>Staff code<input id="sc" value="' + e(r.staff_code || '') + '" placeholder="e.g. guard1"></label><label>New 6-digit PIN<input id="sp" inputmode="numeric" maxlength="6"></label></div><div id="se"></div><button class="btn sec" id="ssv">Save code and PIN</button></details>' : ''));
  $('psv').onclick = function () {
    var b = this; busy(b, true);
    call('api_person_save', { p: { id: id || '', name: $('pn').value, email: $('pe2').value, role: $('pr').value, department: $('pd2').value, hod: $('ph').value, access: $('pa').value, active: $('pac').checked } })
      .then(function () { closeSheet(); toast('Saved'); go('people'); }).catch(function (m) { busy(b, false); errBox('pe', m); });
  };
  if ($('ssv')) $('ssv').onclick = function () {
    var b = this; busy(b, true);
    sb.functions.invoke('nas-staff-login', { body: { personId: id, code: $('sc').value, pin: $('sp').value } }).then(function (r) {
      busy(b, false);
      var msg = (r.data && r.data.error) || (r.error && r.error.message);
      if (msg) errBox('se', msg); else { closeSheet(); toast('Login saved. Code: ' + r.data.code); go('people'); }
    });
  };
}

// ---------- start ----------
function start() {
  return call('api_boot').then(function (b) {
    APP.me = b.me; APP.users = b.users; APP.today = b.today; APP.working = b.working; APP.maxMB = b.maxMB; APP.highCap = b.highCap; APP.cutoff = b.cutoff; APP.stt = !!b.stt; APP.isTeamLead = b.isTeamLead;
    $('hdr').hidden = false; $('side').hidden = false; $('bnav').hidden = false; $('shell').classList.remove('noshell');
    $('sName').textContent = b.me.name; $('sRole').textContent = b.me.role || b.me.access; $('sAv').outerHTML = avatar(b.me.name);
    $('sNew').hidden = $('hNew').hidden = !canCreate();
    go('day');
  }).catch(function (m) { sb.auth.signOut(); showLogin(m); });
}
sb.auth.getSession().then(function (r) {
  var hashErr = new URLSearchParams(location.hash.slice(1)).get('error_description');
  if (r.data.session) start(); else showLogin(hashErr);
});
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
